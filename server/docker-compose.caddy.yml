# Caddy — авто-HTTPS перед всеми сервисами. На сервере:  docker compose -f docker-compose.caddy.yml up -d
# host-сеть нужна, чтобы reverse_proxy localhost:4873/3000 видел сервисы на хосте.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
