# Verdaccio — конфиг приватного реестра.
storage: /verdaccio/storage

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    # Саморегистрация ЗАКРЫТА. Раньше стояло 1000, и любой человек из интернета
    # мог зарегистрироваться, а затем публиковать и удалять пакеты платформы —
    # реестр доступен снаружи через npm.fluttrium.store.
    #
    # ВАЖНО: запрет — это именно -1. Значение 0 регистрацию НЕ закрывает
    # (проверено: запрос на создание пользователя вернул 201).
    # Новых пользователей заводит администратор: временно поставить 1,
    # выполнить npm adduser, вернуть -1.
    max_users: -1

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    cache: true
    timeout: 30s
    max_fails: 2
    fail_timeout: 2m
  # Запасной upstream на случай, если npmjs.org из РФ недоступен/тупит.
  npmmirror:
    url: https://registry.npmmirror.com/
    cache: true
    timeout: 30s

# Учётные записи:
#   fluttrium — боевая, единственная с правом публикации;
#   ci        — только чтение, выдана сборочным конвейерам GitHub Actions.
# Права заданы поимённо: раньше стояло $authenticated, то есть публиковать мог
# ЛЮБОЙ вошедший, включая read-only учётки.
packages:
  # SDK витрин — открыт на чтение без логина: в нём только публичная схема Shop API
  # и клиент, а витринам (moshna и др.) так не нужен токен реестра ни на VPS, ни в CI.
  # Как и остальные наши пакеты — без proxy: подменить его из npmjs нельзя.
  # Блок выше '@fluttrium/*': Verdaccio берёт первое подходящее правило.
  '@fluttrium/shop-sdk':
    access: $all
    publish: fluttrium
    unpublish: fluttrium

  # Наши пакеты: движок, платформа, дизайн-система дашборда. Наружу НЕ проксируем.
  '@fluttrium/*':
    access: $authenticated
    publish: fluttrium
    unpublish: fluttrium

  # Наша копия Vendure: ОТРЕЗАНА от upstream (нет proxy) — hosted-only.
  # Артефакты (3.6.4) опубликованы из vendor-mirror/ (байт-в-байт upstream, без пересборки).
  # Апгрейд = сами публикуем новую версию сюда. npmjs для @vendure/* больше не нужен.
  '@vendure/*':
    access: $authenticated
    publish: fluttrium

  # Дизайн-система Dashboard — тоже наша копия, hosted без proxy.
  # ВАЖНО: блок выше catch-all '**', иначе уйдёт в proxy.
  '@vendure-io/*':
    access: $authenticated
    publish: fluttrium

  # Всё остальное — кэшируем (сначала npmjs, при отказе — зеркало). Это и есть
  # «независимость от npmjs.com»: один раз скачалось → лежит у тебя на ВПС.
  '**':
    access: $all
    publish: fluttrium
    proxy: npmjs npmmirror

server:
  keepAliveTimeout: 60

web:
  title: fluttrium registry

log:
  type: stdout
  format: pretty
  level: info
