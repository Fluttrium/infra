# Приватный npm-реестр (Verdaccio).
# - хранит наши пакеты под скоупом @fluttrium: движок, платформа, дизайн-система
# - кэширует/проксирует публичный npm → сборки не зависят от доступности npmjs.com
#
# Запуск на ВПС:  docker compose up -d
# Наружу реестр выходит только через Caddy на npm.fluttrium.store (TLS).

services:
  registry:
    image: verdaccio/verdaccio:6
    restart: unless-stopped
    ports:
      # Только локальный интерфейс. Раньше стояло "4873:4873" — порт слушал все
      # интерфейсы, а опубликованные порты Docker обходят ufw, то есть реестр был
      # доступен из интернета напрямую, минуя TLS и вопреки собственному README.
      - "127.0.0.1:4873:4873"
    volumes:
      - ./config.yaml:/verdaccio/conf/config.yaml:ro
      - registry-storage:/verdaccio/storage

volumes:
  registry-storage:
